#!/usr/bin/env python3
# -*- coding: utf-8 -*-
# Copy of NACA0012-DR-originTD3-constant-utau.yml (setup of 2026-11-06) with the HydroGym TD3 policy replaced by
# the LBM-trained actors of RWTH (see data/policies_meta_wing_dr/README_rwth_lbm.md). Observation, action, amplitude,
# update interval (ndrl 31 at dt 4e-5) and zero net mass flux are unchanged.
# N1+F: actor F for x/c < 0.48, actor N1 for x/c > 0.48 (no wall node lies at x/c = 0.48).
embedded:
    enabled: true
    net_precision: 8
    # At 4,096 ranks, recording every cycle for this 10M-cycle production
    # budget would be excessive.  Override to 1 for a short smoke test.
    rec_freq: 1000
    rec_bufsize: 1000
    # This will be set by .sh and true by defalut 
    resume: true
    coupled_recorder: true

runner: 
    nb_interactions : 10_000_000
    random_init     : -2  # -1==No Shuffle, use the No.init = RANK; -2==NOT Cover the current restart file
    rank            : 1 # ID of test case and restart file to use 

    case_name       : "naca0012_mode30_constant_utau_rwthN1F" 

    agent_ctrl_area :  [[0.23,0.48],[0.48,0.87],]
    agent_ctrl_side : ["SS","SS",] # SS for suction side
    ## A list of integer to indicate agent case
    agent_run_name : ["rwth_lbm_F","rwth_lbm_N1"]
    ## A list of string to indicate which policy to read
    ## [REMINDER] policy = FULL policy file name (stem, no .zip); the agent_run_name prefix is NOT auto-added anymore (MetaPolicy._load_policy)
    policy : ["eval_model_rwth_lbm_F","eval_model_rwth_lbm_N1"]
    ## A list of string to indicate the RL algorithm
    RL_algorithm : ["TD3","TD3",]
    source_solvers : ["nek","nek",]
    
    ## A list of float indicating the local u_tau 
    u_tau :  [1.0,1.0,] # We use local scale from NEK 
    ## A list of float indicating the local dU/dy 
    dUdy : [480.54,480.54]
    ## Action bounds in tuple
    action_bounds : [[-1.0, 1.0], [-1.0, 1.0]]

    ## The drl update interval 
    # 36, 44, 52, 80 -> 36, 45, 54, 81
    drl_steps : [1, 1] # make ndrl=4 therefore mpi time will be reduced, drl=4 therefore mpi time will be reduced!

    ## Some IO Management 
    vars_record      : True
    ###NOTE: The steps are based on the nb_interactions, not simulation!! 
    vars_record_freq : 1 
    vars_io_freq     : 100  ## Freq the save the data
    size_history     : 10 # Number of DRL steps to record the history
    
    # netgain_io_freq : 100 ## This is not used here.
    reward_fn : dudy 

simulation: 
    #I/O
    CASENAME: 'naca_wing' 
    exeName : 'nek5000'
    compile_path   : "envs/cases/naca0012_200k_constant_utau"
    restart_folder : "data/restarts/rs8_naca0012_DRL_261028"
    shared_data_path : "data/simulations/naca0012_200k_30mode"
    solver_version : "v17"
    
    #------------------------------------------
    # Generally VERY IMPORTANT
    TOTCTRL : 5000        # Be consistent with SIZE
    # Rank of the test case
    nproc   : 4096         
    ndrl    : 31          # Steps to update the rewards (t^+=0.6)
    znmf_avg: 1           # NEK(1 == open, 0=close,) -1== Naive Average 
    target_cfl: 2.0           # NEK(1 == open, 0=close,) -1== Naive Average 
    #--------------------------
    # .rea file 
    #--------------------------
    ### General 
    ## numSteps >= n_episodes * ndrl 
    numSteps            : 5_000_000 # p011 --- T_FO = 10 
    dt                  : -4.0e-05   # p012
    
    ## Write Interval of La2 and Reg
    writeInterval       : 20000      # p015
    writeLA2            : 20000     # p070
    #[PRESSURE]
    p_residualTol       : 5.0e-6      # p021 ## Less constrain on the solution, same setup as OC
    v_residualTol       : 1.0e-8      # p022
    density             : 1.0       # p001
    viscosity           : -2.0E5   # p002
    
    #[_CHKPOINT]   # Runtime paramere section for checkpoint module
    READCHKPT           : 1         # p076 # Restat from checkpoint
    CHKPFNUMBER         : 6         # p067 # Restart file number
    CHKPINTERVAL        : 5000      # p075 # Checkpiont saving frequency (number of time steps)

    #[_STAT]             # Runtime paramere section for statistics module
    AVSTEP              : 10        # p087
    IOSTEP              : 5000     # p088

# Integrating the policy path
logging: 
    policy_dir: "./data/policies_meta_wing_dr/"
